<div class='modal' id='contato'>
    <a href='#' style='font-size:2000px; color:#0000'>___</a> <!-- hack para 'fechar' modal ao clicar fora do conteúdo -->
    <div class='modalContent'>
        <h2>Contato</h2>
        <form id='formulario'>
            <input class=contato type='text' name='nome' placeholder='nome' required />
            <input class=contato type='email' name='email' placeholder='email' required />
            <textarea class=contato style='height:200px;' placeholder='Escreva aqui a sua mensagem:' required></textarea>
            <div style='display:flex;justify-content:center'>
                <input type='submit' class='botao' style='width:30%' value='Enviar mensagem' />
            </div>
        </form>
        <a href='#' class='closeButton'>&times;</a>
    </div>
</div>

<footer>
    <h1>Contato</h1>

</footer>
