<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat&display=swap" rel="stylesheet">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EconoMarket</title>
    <script src="../scripts/inserirHeader.js"></script>
    <script src="../scripts/inserirContato.js"></script>
    <script src="../scripts/inserirProdutos.js"></script>
    <script src="../scripts/listaCompra.js"></script>
    <link rel="stylesheet" href="../estilos/index.css">
    <link rel="stylesheet" href="../estilos/modal.css">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const idCategoria = urlParams.get('categoria')
        const textoBusca = urlParams.get('busca')
    </script>
</head>

<body>
    <!-- PRODUTOS -->
    <div class="" id="categoria-geral">
    </div>

    <script>
        inserirHeader();
        preencherProdutos({ id:idCategoria , busca:textoBusca });

        function scrollNav(valor) {
            const navMenu = document.querySelector('.nav-menu');

            navMenu.scrollBy({
                left: valor,
                behavior: 'smooth'
            });
        }
    </script>

    <!-- HORTIFRUTI -->
    <div id="hortifruti" class="container1">
        <div class="card-produto"> <img src="../imagens/banana.jpg">
            <div class="preco-produto">R$5,29–R$5,99</div>
            <div class="nome-produto">Banana kg</div> <button class="btn-add">+</button>
        </div>
    </div>
    <!-- AÇOUGUE -->
    <div id="acougue" class="container1">
        <div class="card-produto"> <img src="../imagens/carne.jpg">
            <div class="preco-produto">R$39,99–R$49,99</div>
            <div class="nome-produto">Coxão Mole kg</div> <button class="btn-add">+</button>
        </div>
    </div>

    <script>
        inserirContato()
    </script>

</body>

</html>
