<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>paginaLogin</title>
    <link rel="stylesheet" href="../estilos/paginaLogin.css">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat&display=swap" rel="stylesheet">
</head>

<body>
    <form class="formularioLogin">
        <div class="topo">

            <div class="logo">
                <a href="paginaPrincipal.html">
                    <img src="/imagens/LogoEconoMarket.png" alt="" class="icone-logo">
                </a>
            </div>

            <div class="title">
                <h1 id="header">Seja bem-vindo</h1>
                <p>Já sou cliente</p>
            </div>

        </div>

        <div class="inputs">
            <div class="email">
                <p>E-mail</p>
                <input type="email" class="emailinp">
            </div>
            <div class="senha">
                <p>Senha</p>
                <input type="password" class="senhainp">
            </div>
        </div>

        <div class="recuperar">
            <p>Recuperar e-mail</p>
            <p>Recuperar senha</p>
        </div>

        <input type="button" class="btnentrar" onclick="entrar()" value="Entrar" />




        <p id="mensagem-erro"></p>

        <p id="texto-cadastre">Ainda não tem uma conta?
            <a href="paginaCadastro.html">
                <span id="cadastre">
                    Cadastre-se aqui
                </span>
            </a>
        </p>

    </form>

    <script src="../scripts/paginaLogin.js"></script>
</body>

</html>
