<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>paginaLogin</title>
    <link rel="stylesheet" href="../estilos/formularios.css">
    <link rel="stylesheet" href="../estilos/index.css">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat&display=swap" rel="stylesheet">
</head>

<body>
    <form id="formularioLogin" class="formulario formulario-login">
        <div class="topo">
            <div class="logo">
                <a href="paginaPrincipal.html">
                    <img src="../imagens/LogoEconoMarket.png" alt="" class="icone-logo">
                </a>
            </div>

            <div class="title">
                <h1>Seja bem-vindo</h1>
                <p>Já tenho cadastro</p>
            </div>
        </div>

        <div class="meio">
            <div class="inputs">
                <div class="email">
                    <p>E-mail</p>
                    <input type="email" id="emailinp" required />
                </div>
                <div class="senha">
                    <p>Senha</p>
                    <input type="password" id="senhainp" required />
                </div>
            </div>
            <div class="recuperar">
                <p>
                    <a href="mailto:economarketofc@gmail.com?subject=Recuperação%20de%20email">Recuperar e-mail</a>
                </p>
                <p>
                    <a href="mailto:economarketofc@gmail.com?subject=Recuperação%20de%20senha">Recuperar senha</a>
                </p>
            </div>

        </div>

        <div class="fim">
            <p class="mensagem-erro" id="msg-erro-login"></p>

            <div class="button-link-div">
                <input type="submit" class="btn" value="Entrar" />
                <script>
                    formulario = document.getElementById("formularioLogin")
                    formulario.addEventListener("submit", (evento) => { entrar(evento) })
                </script>

                <div class="link">
                    <p>Ainda não tem uma conta?</p>
                    <a href="paginaCadastro.html" class="cadastre">Cadastre-se aqui</a>
                </div>
            </div>
        </div>
    </form>

    <script src="../scripts/paginaLogin.js"></script>
</body>

</html>
