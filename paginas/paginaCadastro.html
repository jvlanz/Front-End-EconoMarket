<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>paginaCadastro</title>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../estilos/formularios.css">
    <link rel="stylesheet" href="../estilos/index.css">
</head>

<body>
    <form class="formulario formulario-cadastro" id="formulario-cadastro">
        <div class="topo">
            <div class="logo">
                <a href="paginaPrincipal.html">
                    <img src="../imagens/LogoEconoMarket.png" class="icone-logo">
                </a>
            </div>

            <div class="title">
                <h1>Cadastre-se</h1>
                <p>Ainda não tenho cadastro</p>
            </div>
        </div>

        <div class="meio">
            <div class="inputs">
                <div class="nome">
                    <p>Nome e sobrenome*</p>
                    <input type="text" id="nome-cadastro" required>
                </div>

                <div class="email">
                    <p>E-mail*</p>
                    <input type="text" id="email-cadastro" required>
                </div>

                <div class="senha">
                    <p>Senha*</p>
                    <input type="password" id="senha-cadastro" required>
                </div>

                <div class="telefone">
                    <p>Telefone*</p>
                    <input type="text" id="telefone-cadastro" required>
                </div>
            </div>

            <div class="termos">
                <input type="checkbox" required></button>
                <p>
                    Ao cadastrar-se, você concorda com os <span style="cursor: pointer;">Termos de Uso</span>
                    e a <span style="cursor: pointer;">Política de Privacidade<span>.
                            <p>
            </div>
        </div>


        <div class="fim">
            <p class="mensagem-erro" id="msg-erro-cadastro"></p>

            <div class="button-link-div">
                <input type="submit" class="btn" value="Criar Cadastro" />
                <script>
                    const formulario = document.getElementById("formulario-cadastro");
                    formulario.addEventListener("submit", (evento) => { cadastrar(evento) })
                </script>

                <div class="link">
                    <p>Já tem uma conta?</p>
                    <a href="paginaLogin.html">Faça login aqui</a>
                </div>
            </div>
        </div>
    </form>

    <script src="../scripts/paginaCadastro.js"></script>
</body>

</html>
