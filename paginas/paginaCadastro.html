<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>paginaCadastro</title>
    <link rel="stylesheet" href="../estilos/paginaCadastro.css">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/estilos/paginaLogin.css">
</head>

<body>
    <form class="formularioLogin-cadastro">
        <div class="topo">
            <div class="logo">
                <a href="paginaPrincipal.html">
                    <img src="/imagens/LogoEconoMarket.png" class="icone-logo">
                </a>
            </div>

            <div class="title">
                <h2>Cadastre-se</h2>
            </div>
        </div>

        <div class="inputs">
            <div class="nome">
                <p>Nome e sobrenome*</p>
                <input type="text" id="nome-cadastro" required>
            </div>

            <div class="email">
                <p>E-mail*</p>
                <input type="text" id="email-cadastro" required>
            </div>

            <div class="senha">
                <p>Senha*</p>
                <input type="password" id="senha-cadastro" required>
            </div>

            <div class="telefone">
                <p>Telefone*</p>
                <input type="text" id="telefone-cadastro" required>
            </div>
        </div>

        <div class="termos">
            <input type="checkbox" required></button>
            <p>
                Ao cadastrar-se, você concorda com os <span>Termos de Uso</span>
                e a <span>Política de Privacidade<span>.
                        <p>
        </div>

        <input type="submit" class="btnentrar" onclick="cadastrar()" value="Criar Cadastro" />

        <p id="mensagem-erro"></p>

        <p id="texto-voltar-login">Já tem uma conta?<span class="voltar-login" onclick="abrirLogin()">Faça login
                aqui</span></p>
    </form>

    <script src="../scripts/paginaCadastro.js"></script>
</body>

</html>
