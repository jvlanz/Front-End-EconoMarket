<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pagina Editar Perfil</title>
    <script src="../scripts/paginaEditar.js"></script>
    <link rel="stylesheet" href="../estilos/paginaEditarPerfil.css" />
  </head>

  <body>
    <form id="formulario" class="formularioLogin-editar">
      <div class="topo">
        <div class="logo">
          <a href="paginaPrincipal.html">
            <img src="../imagens/LogoEconoMarket.png" class="icone-logo" />
          </a>
        </div>

        <div class="title">
          <h2>Editar seu Perfil</h2>
        </div>
      </div>

      <div class="inputs">
        <div class="nome">
          <p>Nome e sobrenome</p>
          <input type="text" id="nome-cadastro" />
        </div>

        <div class="email">
          <p>E-mail</p>
          <input type="text" id="email-cadastro" />
        </div>

        <div class="senha">
          <p>Senha</p>
          <input type="password" id="senha-cadastro" />
        </div>
      </div>
      <p class="mensagem-erro"></p>

      <input type="submit" class="btnentrar" value="Editar Cadastro" />
    </form>
    <script>
      preencherDados();
    </script>
  </body>
</html>
